# FAISS index
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: faiss-index-pvc
  namespace: {{ .Values.namespace }}
  labels:
    app: rag-backend
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: {{ .Values.persistence.storageClass }}
  resources:
    requests:
      storage: {{ .Values.persistence.faissIndex.size }}

